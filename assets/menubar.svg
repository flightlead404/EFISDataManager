<?xml version="1.0" encoding="UTF-8"?>
<!-- Menu bar glyph: simplified color PFD (horizon + wings), no bezel.
     Designed to read at ~18px. Rendered at high res then downscaled. -->
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="round">
      <rect x="112" y="176" width="800" height="672" rx="120" ry="120"/>
    </clipPath>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16abe8"/>
      <stop offset="1" stop-color="#0784c9"/>
    </linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a5422"/>
      <stop offset="1" stop-color="#5b3312"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#round)">
    <!-- Tilted attitude scene -->
    <g transform="rotate(-8 512 512)">
      <rect x="-300" y="-300" width="1624" height="812" fill="url(#sky)"/>
      <rect x="-300" y="512" width="1624" height="1112" fill="url(#ground)"/>
      <rect x="-300" y="496" width="1624" height="32" fill="#ffffff"/>
    </g>
    <!-- Bold level wings (fixed) — enlarged/thickened so they survive 18px downscale -->
    <g fill="#ffd400" stroke="#1a1a1a" stroke-width="14">
      <rect x="196" y="474" width="212" height="58" rx="14"/>
      <rect x="616" y="474" width="212" height="58" rx="14"/>
      <rect x="470" y="452" width="84" height="102" rx="14"/>
    </g>
  </g>
  <!-- Subtle outline so the light sky edge stays defined on a light menu bar -->
  <rect x="112" y="176" width="800" height="672" rx="120" ry="120"
        fill="none" stroke="#1a1a1a" stroke-width="14" opacity="0.55"/>
</svg>
