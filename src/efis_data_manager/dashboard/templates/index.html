{% extends "base.html" %}
{% block title %}Flights — EFIS Data Manager{% endblock %}
{% block content %}
<h1>Flights</h1>
<div style="margin-bottom: 1rem;">
    <a href="/api/export/flights" class="btn">Export CSV</a>
</div>
<div class="card">
    <table id="flights-table">
        <thead>
            <tr>
                <th>Date</th>
                <th>Duration</th>
                <th>Airborne</th>
                <th>Max Alt</th>
                <th>Max IAS</th>
                <th>Max CHT</th>
                <th>Max EGT</th>
                <th>Oil Temp</th>
                <th>Oil Press</th>
                <th>Fuel</th>
                <th>Alerts</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
</div>
{% endblock %}
{% block scripts %}
<script>
fetch('/api/flights')
    .then(r => r.json())
    .then(flights => {
        const tbody = document.querySelector('#flights-table tbody');
        flights.forEach(f => {
            const dur = (f.duration_seconds / 60).toFixed(0);
            const air = (f.airborne_seconds / 60).toFixed(0);
            // Simple alert check
            let alertBadge = '<span class="badge badge-ok">OK</span>';
            if (f.max_cht && f.max_cht >= 420) alertBadge = '<span class="badge badge-warning">CHT</span>';
            else if (f.max_cht && f.max_cht >= 380) alertBadge = '<span class="badge badge-caution">CHT</span>';

            tbody.innerHTML += `<tr>
                <td><a href="/flight/${f.id}" class="flight-link">${f.date}</a></td>
                <td>${dur} min</td>
                <td>${air} min</td>
                <td>${f.max_pressure_altitude ? f.max_pressure_altitude.toFixed(0) : '-'} ft</td>
                <td>${f.max_indicated_airspeed ? f.max_indicated_airspeed.toFixed(0) : '-'} kts</td>
                <td>${f.max_cht ? f.max_cht.toFixed(0) : '-'}°F</td>
                <td>${f.max_egt ? f.max_egt.toFixed(0) : '-'}°F</td>
                <td>${f.max_oil_temp ? f.max_oil_temp.toFixed(0) : '-'}°F</td>
                <td>${f.min_oil_pressure ? f.min_oil_pressure.toFixed(0) : '-'} psi</td>
                <td>${f.fuel_used ? f.fuel_used.toFixed(1) : '-'} gal</td>
                <td>${alertBadge}</td>
            </tr>`;
        });
    });
</script>
{% endblock %}
